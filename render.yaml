services:
  - type: web
    name: wellness-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: FRONTEND_URL
        value: https://wellness-frontend-wine.vercel.app
      - key: ALLOWED_HOSTS
        value: wellness-backend-w3l3.onrender.com,localhost,127.0.0.1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wellness-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
    healthCheckPath: /api/health
    autoDeploy: true
    rootDir: backend
  - type: database
    name: wellness-db
    plan: free
    databaseName: wellness
    user: wellness_user
