services:
  - type: web
    name: wellness-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wellness-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
    autoDeploy: true
    rootDir: backend
  - type: database
    name: wellness-db
    plan: free
    databaseName: wellness
    user: wellness_user
